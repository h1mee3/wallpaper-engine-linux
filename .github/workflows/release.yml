name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.4.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwayland-dev \
            libegl-dev \
            libgl-dev \
            libmpv-dev \
            libgtk-3-dev \
            libgtk-layer-shell-dev \
            libwebkit2gtk-4.1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release

      - name: Package release artifacts
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          mkdir -p dist
          cp target/release/wengine dist/
          cp target/release/wengine-layer-player dist/
          cp target/release/wengine-web-player dist/
          cp target/release/wengine-ui dist/
          chmod +x dist/*
          tar -czf "wengine-${TAG}-linux-x86_64.tar.gz" -C dist .
          cp "wengine-${TAG}-linux-x86_64.tar.gz" "wengine-linux-x86_64.tar.gz"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/wengine
            dist/wengine-layer-player
            dist/wengine-web-player
            dist/wengine-ui
            wengine-*-linux-x86_64.tar.gz
            wengine-linux-x86_64.tar.gz
